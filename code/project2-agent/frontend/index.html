<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星辰商城 · AI 客服</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, "Microsoft YaHei", sans-serif; background: #f5f6f8; height: 100vh; display: flex; flex-direction: column; }
    header { background: #1677ff; color: #fff; padding: 14px 20px; }
    header h1 { font-size: 18px; font-weight: 600; }
    header p { font-size: 12px; opacity: 0.85; margin-top: 2px; }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .bubble { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .user { align-self: flex-end; background: #1677ff; color: #fff; border-bottom-right-radius: 4px; }
    .assistant { align-self: flex-start; background: #fff; border: 1px solid #e5e6eb; border-bottom-left-radius: 4px; }
    .tools { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 6px; }
    .tools span { font-size: 12px; color: #7a4d00; background: #fff7e6; border: 1px solid #ffd591; border-radius: 10px; padding: 2px 10px; }
    footer { display: flex; gap: 10px; padding: 14px 20px; background: #fff; border-top: 1px solid #e5e6eb; }
    #input { flex: 1; border: 1px solid #d9dce0; border-radius: 8px; padding: 10px 14px; font-size: 14px; outline: none; }
    #input:focus { border-color: #1677ff; }
    #send { background: #1677ff; color: #fff; border: none; border-radius: 8px; padding: 0 22px; font-size: 14px; cursor: pointer; }
    #send:disabled { background: #a0c4ff; cursor: not-allowed; }
    .error { color: #cf1322; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>🛒 星辰商城 · AI 客服</h1>
    <p>查订单 / 物流 / 退换政策 —— 前后端分离架构演示（FastAPI + 原生 JS）</p>
  </header>

  <div id="messages"></div>

  <footer>
    <input id="input" placeholder="试试：我（张小明）有哪些订单？第一单到哪了？" autocomplete="off" />
    <button id="send">发送</button>
  </footer>

  <script>
    // 会话 ID：首次访问生成，存 localStorage——后端用它区分不同用户的记忆
    if (!localStorage.getItem("session_id")) {
      localStorage.setItem("session_id", "s-" + Math.random().toString(36).slice(2, 10));
    }
    const sessionId = localStorage.getItem("session_id");

    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendEl = document.getElementById("send");

    function addBubble(role, text) {
      const div = document.createElement("div");
      div.className = "bubble " + role;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function addToolsChips(toolsUsed) {
      if (!toolsUsed || toolsUsed.length === 0) return;
      const wrap = document.createElement("div");
      wrap.className = "tools";
      toolsUsed.forEach((t) => {
        const chip = document.createElement("span");
        chip.textContent = "🔧 " + t;
        wrap.appendChild(chip);
      });
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = "";
      sendEl.disabled = true;

      addBubble("user", text);
      const thinking = addBubble("assistant", "思考中…");

      try {
        // 前后端分离的全部秘密：前端只是一次 fetch + JSON
        const resp = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          thinking.textContent = "⚠️ " + (data.reply || "服务异常，请稍后再试");
          thinking.className = "bubble assistant error";
        } else {
          thinking.textContent = data.reply;
          addToolsChips(data.tools_used);
        }
      } catch (err) {
        // 网络层失败（后端没启动/断网）：fetch 本身抛错
        thinking.textContent = "⚠️ 无法连接服务器，请确认后端已启动";
        thinking.className = "bubble assistant error";
      } finally {
        sendEl.disabled = false;
        inputEl.focus();
      }
    }

    sendEl.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    addBubble("assistant", "你好！我是星辰商城 AI 客服，可以帮你查订单、物流和退换政策。");
  </script>
</body>
</html>
